name: Release QuantumOX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release QuantumOX
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch:
          - x86-64-avx512icl
          - x86-64-vnni512
          - x86-64-avx512
          - x86-64-avxvnni
          - x86-64-bmi2
          - x86-64-avx2
          - x86-64-sse41-popcnt
          - x86-64
          - x86-32
          - ppc-64-vsx
          - ppc-64-altivec
          - armv8-dotprod
          - armv8
          - armv7-neon
          - armv7
          - loongarch64-lasx
          - loongarch64-lsx
          - loongarch64
          - apple-silicon
          - riscv64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Install build tools ----
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update -y
          sudo apt install -y g++ make zip tar

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install make zip gnu-tar || true

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install make zip -y || true

      # ---- Build QuantumOX ----
      - name: Build QuantumOX
        shell: bash
        run: |
          mkdir -p bin
          echo "Building for ${{ matrix.arch }} on ${{ runner.os }}"
          make -j build ARCH=${{ matrix.arch }}
          # Move built binary to bin/ with proper naming
          exe="quantumox-${{ runner.os | toLowerCase }}-${{ matrix.arch }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            mv "bin/quantumox.exe" "bin/${exe}.exe" 2>/dev/null || mv "quantumox.exe" "bin/${exe}.exe"
          else
            mv "bin/quantumox" "bin/${exe}" 2>/dev/null || mv "quantumox" "bin/${exe}"
          fi

      # ---- Package ----
      - name: Package Executable
        shell: bash
        run: |
          cd bin
          exe="quantumox-${{ runner.os | toLowerCase }}-${{ matrix.arch }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            zip "../${exe}.zip" "${exe}.exe"
          else
            tar -czf "../${exe}.tar.gz" "${exe}"
          fi
          cd ..

      # ---- Upload to Release ----
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quantumox-${{ runner.os | toLowerCase }}-${{ matrix.arch }}.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
