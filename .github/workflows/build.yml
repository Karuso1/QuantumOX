name: Build QuantumOX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile QuantumOX (C++)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Install build tools ----
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y g++ tar

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install gnu-tar || true

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install mingw -y || true

      # ---- Detect native architecture ----
      - name: Detect architecture
        id: native
        shell: bash
        run: |
          arch=$(uname -m)
          os=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$arch" == "x86_64" ]]; then
            arch="x86-64"
          fi
          echo "os=$os" >> $GITHUB_OUTPUT
          echo "arch=$arch" >> $GITHUB_OUTPUT

      # ---- Build ----
      - name: Build QuantumOX
        shell: bash
        run: |
          mkdir -p bin
          os=${{ steps.native.outputs.os }}
          arch=${{ steps.native.outputs.arch }}
          exe_name="quantumox-${os}-${arch}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            exe_name="${exe_name}.exe"
          fi
          echo "Compiling -> bin/${exe_name}"
          g++ -std=c++20 -O3 -Wall -Wextra src/*.cpp -o "bin/${exe_name}"

      # ---- Package (Linux/macOS only) ----
      - name: Package Binary (non-Windows)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd bin
          os="${{ steps.native.outputs.os }}"
          arch="${{ steps.native.outputs.arch }}"
          exe="quantumox-${os}-${arch}"
          tar -czf "${exe}.tar.gz" "${exe}"
          rm "${exe}"
          cd ..

      # ---- Verify Output ----
      - name: Verify Build Output
        shell: bash
        run: |
          echo "Final bin contents:"
          ls -lh bin/

      # ---- Upload Artifacts ----
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumOX-${{ steps.native.outputs.os }}-${{ steps.native.outputs.arch }}
          path: |
            bin/*.exe
            bin/*.tar.gz
