name: Release QuantumOX

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build and Release QuantumOX
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Install build tools ----
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update -y
          sudo apt install -y g++ zip tar

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install zip gnu-tar || true

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install zip -y || true

      # ---- Detect architecture ----
      - name: Detect native arch
        id: native
        shell: bash
        run: |
          arch=$(uname -m)
          os=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          if [[ "$arch" == "x86_64" ]]; then
            arch="x86-64"
          fi
          echo "os=$os" >> $GITHUB_OUTPUT
          echo "arch=$arch" >> $GITHUB_OUTPUT

      # ---- Build ----
      - name: Build QuantumOX
        shell: bash
        run: |
          mkdir -p bin
          os=${{ steps.native.outputs.os }}
          arch=${{ steps.native.outputs.arch }}
          exe="quantumox-${os}-${arch}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            exe="${exe}.exe"
          fi
          echo "Compiling -> bin/${exe}"
          g++ -std=c++20 -O3 -Wall -Wextra src/*.cpp -o "bin/${exe}"

      # ---- Package ----
      - name: Package Executable
        shell: bash
        run: |
          cd bin
          os="${{ steps.native.outputs.os }}"
          arch="${{ steps.native.outputs.arch }}"
          exe="quantumox-${os}-${arch}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            zip "../${exe}.zip" "${exe}.exe"
          else
            tar -czf "../${exe}.tar.gz" "${exe}"
          fi
          cd ..

      # ---- Upload Release Asset ----
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quantumox-${{ steps.native.outputs.os }}-${{ steps.native.outputs.arch }}.zip
            quantumox-${{ steps.native.outputs.os }}-${{ steps.native.outputs.arch }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
