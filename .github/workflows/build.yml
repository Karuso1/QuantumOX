name: Build QuantumOX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Compile QuantumOX
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [
          native,
          x86-64-avx512icl,
          x86-64-vnni512,
          x86-64-avx512,
          x86-64-avxvnni,
          x86-64-bmi2,
          x86-64-avx2,
          x86-64-sse41-popcnt,
          x86-64,
          x86-32,
          ppc-64-vsx,
          ppc-64-altivec,
          armv8-dotprod,
          armv8,
          armv7-neon,
          armv7,
          loongarch64-lasx,
          loongarch64-lsx,
          loongarch64,
          apple-silicon,
          riscv64
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Install build tools ----
      - name: Install build tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y g++ make tar

      - name: Install build tools (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install gnu-tar make || true

      - name: Install build tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install mingw make -y || true

      # ---- Build with Makefile ----
      - name: Build QuantumOX
        shell: bash
        run: |
          mkdir -p bin
          arch=${{ matrix.arch }}
          os=${{ matrix.os }}
          exe_name="quantumox-${os}-${arch}"
          if [[ "$os" == "windows-latest" ]]; then
            exe_name="${exe_name}.exe"
          fi
          echo "Building -> bin/${exe_name}"

          # Build one arch at a time
          cd src
          make -j build ARCH=${arch} COMP=g++
          # Move output to bin/
          mv quantumox "${{ github.workspace }}/bin/${exe_name}" || echo "Move failed (check binary name)"

      # ---- Package Binary (non-Windows) ----
      - name: Package Binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd bin
          exe="quantumox-${{ matrix.os }}-${{ matrix.arch }}"
          tar -czf "${exe}.tar.gz" "${exe}"
          rm "${exe}"
          cd ..

      # ---- Upload Artifacts ----
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantumox-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            bin/*.exe
            bin/*.tar.gz
